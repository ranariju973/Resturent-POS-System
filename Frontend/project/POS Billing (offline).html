  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nt<\u002Fspan>\n            <span style=\"font-weight: 600; color: rgba(0,0,0,0.87)\">{{ discountLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showTaxRow }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: rgba(0,0,0,0.32)\">\n              <span style=\"display: flex; align-items: center; gap: 6px; font-weight: 500\">Tax\n                <span style=\"font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 50px; background: #f2f0eb; color: rgba(0,0,0,0.32)\">Later<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-weight: 600\">—<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid #edebe9\">\n            <span style=\"font-size: 15px; font-weight: 700; color: rgba(0,0,0,0.87)\">Total<\u002Fspan>\n            <span style=\"font-size: 24px; font-weight: 800; color: #00754A; line-height: 1.1\">{{ totalLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <sc-if value=\"{{ canGenerate }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ onGenerate }}\" style=\"width: 100%; padding: 13px 24px; border-radius: 50px; border: 1px solid #00754A; background: #00754A; color: #ffffff; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease\" style-hover=\"background: #006241; border-color: #006241\" style-active=\"transform: scale(0.95)\">\n              <img src=\"e69b5a5f-3df0-42f2-afd3-664a76c5b181\" alt=\"\" style=\"width: 17px; height: 17px; flex-shrink: 0; display: block\">Generate Bill\n            <\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ cannotGenerate }}\" hint-placeholder-val=\"{{ false }}\">\n            <button disabled=\"{{ true }}\" title=\"{{ blockedReason }}\" style=\"width: 100%; padding: 13px 24px; border-radius: 50px; border: 1px solid #edebe9; background: #edebe9; color: rgba(0,0,0,0.32); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: not-allowed\">\n              <img src=\"b38dcda5-129c-4c5f-8f6f-1f4edb5352a8\" alt=\"\" style=\"width: 16px; height: 16px; flex-shrink: 0; display: block\">{{ blockedReason }}\n            <\u002Fbutton>\n          <\u002Fsc-if>\n\n          <div style=\"display: flex; gap: 8px\">\n            <button sc-camel-on-click=\"{{ onPrintKot }}\" style=\"flex: 1; padding: 11px 14px; border-radius: 50px; border: 1px solid #00754A; background: #ffffff; color: #00754A; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 7px; transition: all 0.2s ease\" style-hover=\"background: #d4e9e2\" style-active=\"transform: scale(0.95)\">\n              <img src=\"a5bde2da-943c-40fc-a031-ea28d3653894\" alt=\"\" style=\"width: 15px; height: 15px; flex-shrink: 0; display: block\">Print KOT\n            <\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onPrintBill }}\" style=\"flex: 1; padding: 11px 14px; border-radius: 50px; border: 1px solid #00754A; background: #ffffff; color: #00754A; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 7px; transition: all 0.2s ease\" style-hover=\"background: #d4e9e2\" style-active=\"transform: scale(0.95)\">\n              <img src=\"15da87a8-7a67-4389-a5b1-3a65d1dac50b\" alt=\"\" style=\"width: 15px; height: 15px; flex-shrink: 0; display: block\">Print Bill\n            <\u002Fbutton>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ onToggleSend }}\" style=\"width: 100%; padding: 11px 18px; border-radius: 50px; border: 1px solid #d6dbde; background: #ffffff; color: rgba(0,0,0,0.87); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 7px; transition: all 0.2s ease\" style-hover=\"border-color: #00754A; color: #00754A\" style-active=\"transform: scale(0.95)\">\n            <img src=\"d1a1727e-b10f-46b8-9bd7-270bed6b4250\" alt=\"\" style=\"width: 15px; height: 15px; flex-shrink: 0; display: block\">Send Invoice\n            <img src=\"{{ sendChevronUrl }}\" alt=\"\" style=\"width: 15px; height: 15px; flex-shrink: 0\">\n          <\u002Fbutton>\n          <sc-if value=\"{{ sendOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; gap: 8px\">\n              <button sc-camel-on-click=\"{{ onSendWhatsapp }}\" style=\"flex: 1; padding: 10px 14px; border-radius: 50px; border: 1px solid #d6dbde; background: #f9f9f9; color: rgba(0,0,0,0.87); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 7px; transition: all 0.2s ease\" style-hover=\"border-color: #00754A; color: #00754A\" style-active=\"transform: scale(0.95)\">\n                <img src=\"4e4b7a95-2ff8-41d9-895f-b568e965f715\" alt=\"\" style=\"width: 15px; height: 15px; flex-shrink: 0; display: block\">WhatsApp\n              <\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onSendSms }}\" style=\"flex: 1; padding: 10px 14px; border-radius: 50px; border: 1px solid #d6dbde; background: #f9f9f9; color: rgba(0,0,0,0.87); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 7px; transition: all 0.2s ease\" style-hover=\"border-color: #00754A; color: #00754A\" style-active=\"transform: scale(0.95)\">\n                <img src=\"f92096c0-1625-4383-a086-b43ec0b61031\" alt=\"\" style=\"width: 15px; height: 15px; flex-shrink: 0; display: block\">SMS\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; bottom: 24px; right: 24px; display: flex; align-items: center; gap: 10px; padding: 13px 22px; border-radius: 50px; background: #1E3932; color: #ffffff; font-size: 14px; font-weight: 600; box-shadow: 0 0 6px rgba(0,0,0,0.24), 0 8px 12px rgba(0,0,0,0.14); animation: toastIn 0.22s ease-out\">\n      <img src=\"1ec6d7ad-0415-4b08-bbae-346b17ed2088\" alt=\"\" style=\"width: 18px; height: 18px; flex-shrink: 0; display: block\">{{ toast }}\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;restaurantName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Verdant Café&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;staffName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nahid Zaman&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;orderNumber&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;min&quot;:1,&quot;max&quot;:999,&quot;tsType&quot;:&quot;number&quot;},&quot;showTaxRow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;requireCustomerName&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nconst R = (id, url) => (typeof window !== 'undefined' && window.__resources && window.__resources[id]) || url;\nconst CHEV_DOWN = 'https://api.iconify.design/lucide/chevron-down.svg?color=%238f8f8f&width=48&height=48';\nconst CHEV_UP = 'https://api.iconify.design/lucide/chevron-up.svg?color=%238f8f8f&width=48&height=48';\nconst MENU = [\n  { id: 'p1', name: 'Cold Brew', price: 4.25, cat: 'Beverages', img: R('p1', 'https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=280&h=280&fit=crop') },\n  { id: 'p2', name: 'Vanilla Latte', price: 4.75, cat: 'Beverages', img: R('p2', 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=280&h=280&fit=crop') },\n  { id: 'p3', name: 'Iced Matcha', price: 5.25, cat: 'Beverages', img: R('p3', 'https://images.unsplash.com/photo-1515823064-d6e0c04616a7?w=280&h=280&fit=crop') },\n  { id: 'p4', name: 'Shrimp Basil Salad', price: 10.0, cat: 'Salads', img: R('p4', 'https://images.unsplash.com/photo-1626200419199-391ae4be7a41?w=280&h=280&fit=crop') },\n  { id: 'p5', name: 'Garden Greens', price: 8.5, cat: 'Salads', img: R('p5', 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=280&h=280&fit=crop') },\n  { id: 'p6', name: 'Roast Tomato Soup', price: 6.0, cat: 'Soup', img: R('p6', 'https://images.unsplash.com/photo-1547592166-23ac45744acd?w=280&h=280&fit=crop') },\n  { id: 'p7', name: 'Sweet Corn Soup', price: 5.75, cat: 'Soup', img: R('p7', 'https://images.unsplash.com/photo-1547592180-85f173990554?w=280&h=280&fit=crop') },\n  { id: 'p8', name: 'Margherita Pizza', price: 12.5, cat: 'Pizza', img: R('p8', 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=280&h=280&fit=crop') },\n  { id: 'p9', name: 'Vegetable Pizza', price: 13.0, cat: 'Pizza', img: R('p9', 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=280&h=280&fit=crop') },\n  { id: 'p10', name: 'Chicken Biryani', price: 11.75, cat: 'Rice', img: R('p10', 'https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=280&h=280&fit=crop') },\n  { id: 'p11', name: 'Egg Fried Rice', price: 9.0, cat: 'Rice', img: R('p11', 'https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=280&h=280&fit=crop') },\n  { id: 'p12', name: 'Steamed Jasmine Rice', price: 3.5, cat: 'Rice', img: R('p12', 'https://images.unsplash.com/photo-1536304993881-ff6e9eefa2a6?w=280&h=280&fit=crop') },\n  { id: 'p13', name: 'Onion Rings', price: 5.0, cat: 'Salads', img: R('p13', 'https://images.unsplash.com/photo-1639024471283-03518883512d?w=280&h=280&fit=crop') },\n  { id: 'p14', name: 'Chicken Burger', price: 10.5, cat: 'Pizza', img: R('p14', 'https://images.unsplash.com/photo-1550547660-d9450f859349?w=280&h=280&fit=crop') },\n  { id: 'p15', name: 'Fish & Chips', price: 13.5, cat: 'Pizza', img: R('p15', 'https://images.unsplash.com/photo-1585032226651-759b368d7246?w=280&h=280&fit=crop') },\n  { id: 'p16', name: 'Blueberry Muffin', price: 3.25, cat: 'Beverages', img: R('p16', 'https://images.unsplash.com/photo-1607958996333-41aef7caefaa?w=280&h=280&fit=crop') }\n];\nconst CATS = ['Show All', 'Beverages', 'Rice', 'Salads', 'Soup', 'Pizza'];\n\nclass Component extends DCLogic {\n  state = {\n    cat: 'Show All',\n    query: '',\n    customer: '',\n    cart: [\n      { id: 'p2', qty: 2, note: '', noteOpen: false },\n      { id: 'p10', qty: 1, note: 'extra raita', noteOpen: false },\n      { id: 'p6', qty: 1, note: '', noteOpen: false }\n    ],\n    discountMode: 'flat',\n    discountValue: '0',\n    sendOpen: false,\n    toast: ''\n  };\n\n  money(n) { return '$' + n.toFixed(2); }\n\n  flash(msg) {\n    clearTimeout(this._t);\n    this.setState({ toast: msg });\n    this._t = setTimeout(() => this.setState({ toast: '' }), 2600);\n  }\n\n  componentWillUnmount() { clearTimeout(this._t); }\n\n  add = (id) => {\n    const cart = this.state.cart.slice();\n    const i = cart.findIndex(l => l.id === id);\n    if (i > -1) cart[i] = Object.assign({}, cart[i], { qty: cart[i].qty + 1 });\n    else cart.push({ id, qty: 1, note: '', noteOpen: false });\n    this.setState({ cart });\n  };\n\n  bump = (id, d) => {\n    const cart = this.state.cart\n      .map(l => l.id === id ? Object.assign({}, l, { qty: l.qty + d }) : l)\n      .filter(l => l.qty > 0);\n    this.setState({ cart });\n  };\n\n  patch = (id, obj) => {\n    this.setState({ cart: this.state.cart.map(l => l.id === id ? Object.assign({}, l, obj) : l) });\n  };\n\n  renderVals() {\n    const s = this.state;\n    const q = s.query.trim().toLowerCase();\n    const qtyOf = (id) => { const l = s.cart.find(x => x.id === id); return l ? l.qty : 0; };\n\n    const products = MENU\n      .filter(p => (s.cat === 'Show All' || p.cat === s.cat) && (!q || p.name.toLowerCase().includes(q)))\n      .map(p => ({\n        name: p.name, cat: p.cat, img: p.img, priceLabel: this.money(p.price),\n        qty: qtyOf(p.id), inCart: qtyOf(p.id) > 0, onAdd: () => this.add(p.id)\n      }));\n\n    const categories = CATS.map(name => {\n      const on = name === s.cat;\n      return {\n        name,\n        bg: on ? '#00754A' : '#ffffff',\n        fg: on ? '#ffffff' : 'rgba(0,0,0,0.58)',\n        bd: on ? '#00754A' : '#d6dbde',\n        onSelect: () => this.setState({ cat: name })\n      };\n    });\n\n    const lines = s.cart.map(l => {\n      const p = MENU.find(m => m.id === l.id);\n      return {\n        name: p.name, qty: l.qty, note: l.note, noteOpen: l.noteOpen,\n        mathLabel: this.money(p.price) + ' × ' + l.qty,\n        totalLabel: this.money(p.price * l.qty),\n        noteLabel: l.note ? 'Note added' : 'Add note',\n        onInc: () => this.bump(l.id, 1),\n        onDec: () => this.bump(l.id, -1),\n        onRemove: () => this.setState({ cart: s.cart.filter(x => x.id !== l.id) }),\n        onToggleNote: () => this.patch(l.id, { noteOpen: !l.noteOpen }),\n        onNote: (e) => this.patch(l.id, { note: e.target.value })\n      };\n    });\n\n    const subtotal = s.cart.reduce((a, l) => a + MENU.find(m => m.id === l.id).price * l.qty, 0);\n    const raw = parseFloat(s.discountValue) || 0;\n    const discount = Math.min(s.discountMode === 'pct' ? subtotal * raw / 100 : raw, subtotal);\n    const count = s.cart.reduce((a, l) => a + l.qty, 0);\n    const requireName = this.props.requireCustomerName ?? true;\n    const hasName = s.customer.trim().length > 0;\n    const ok = count > 0 && (!requireName || hasName);\n    const blocked = count === 0 ? 'Add an item to bill' : 'Enter customer name';\n\n    return {\n      restaurantName: this.props.restaurantName ?? 'Verdant Café',\n      staffName: this.props.staffName ?? 'Nahid Zaman',\n      staffInitials: (this.props.staffName ?? 'Nahid Zaman').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase(),\n      orderNumber: this.props.orderNumber ?? 20,\n      showTaxRow: this.props.showTaxRow ?? true,\n      categories, products, lines,\n      query: s.query,\n      onQuery: (e) => this.setState({ query: e.target.value }),\n      resultCount: products.length + ' items',\n      noResults: products.length === 0,\n      customerName: s.customer,\n      onCustomerName: (e) => this.setState({ customer: e.target.value }),\n      nameBorder: requireName && !hasName ? '#cba258' : '#d6dbde',\n      nameLabelColor: requireName && !hasName ? '#8a6a24' : 'rgba(0,0,0,0.58)',\n      nameHint: requireName && !hasName ? '· required' : '',\n      itemCountLabel: count === 1 ? '1 item' : count + ' items',\n      isEmpty: s.cart.length === 0,\n      discountValue: s.discountValue,\n      discountUnit: s.discountMode === 'pct' ? '%' : '$',\n      onDiscount: (e) => this.setState({ discountValue: e.target.value }),\n      onFlat: () => this.setState({ discountMode: 'flat' }),\n      onPct: () => this.setState({ discountMode: 'pct' }),\n      flatBg: s.discountMode === 'flat' ? '#ffffff' : 'transparent',\n      flatFg: s.discountMode === 'flat' ? '#00754A' : 'rgba(0,0,0,0.45)',\n      pctBg: s.discountMode === 'pct' ? '#ffffff' : 'transparent',\n      pctFg: s.discountMode === 'pct' ? '#00754A' : 'rgba(0,0,0,0.45)',\n      subtotalLabel: this.money(subtotal),\n      discountLabel: (discount > 0 ? '− ' : '') + this.money(discount),\n      totalLabel: this.money(Math.max(subtotal - discount, 0)),\n      canGenerate: ok,\n      cannotGenerate: !ok,\n      blockedReason: blocked,\n      onGenerate: () => this.flash('Bill generated for ' + s.customer.trim()),\n      onPrintKot: () => this.flash('Kitchen ticket sent to printer'),\n      onPrintBill: () => this.flash('Bill sent to receipt printer'),\n      sendOpen: s.sendOpen,\n      sendChevronUrl: s.sendOpen ? R('chevUp', CHEV_UP) : R('chevDown', CHEV_DOWN),\n      onToggleSend: () => this.setState({ sendOpen: !s.sendOpen }),\n      onSendWhatsapp: () => { this.setState({ sendOpen: false }); this.flash('Invoice sent on WhatsApp'); },\n      onSendSms: () => { this.setState({ sendOpen: false }); this.flash('Invoice sent by SMS'); },\n      toast: s.toast\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
